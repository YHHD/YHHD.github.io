name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Ensure generated site is committed
        run: git diff --exit-code -- docs
